services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    environment:
      - PHP_ERROR_REPORTING=E_ALL & ~E_DEPRECATED & ~E_NOTICE
      - PHP_DISPLAY_ERRORS=On
      - DB_HOST=db
      - DB_USER=exa_user
      - DB_PASSWORD=exa_pass
      - DB_NAME=exa_database
    depends_on:
      - db
    networks:
      - exa-network

  db:
    image: mysql:8.0
    container_name: exa-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_pass
      MYSQL_DATABASE: exa_database
      MYSQL_USER: exa_user
      MYSQL_PASSWORD: exa_pass
    volumes:
      - exa_db_data:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d
    networks:
      - exa-network

volumes:
  exa_db_data:

networks:
  exa-network:
    driver: bridge
