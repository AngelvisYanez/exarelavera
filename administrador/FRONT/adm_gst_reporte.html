<table id="datosTabla" style="table-layout: fixed; width: 100%; word-wrap: break-word; border-collapse: collapse; font-family:Verdana, Geneva, sans-serif; font-size:12px"

        <th style="border:0;" colspan="9" style="width:100%;font-size: 12px;">REPORTE DE TAREAS</th>
    </tr>

    <tr>

        <th style="width:10%;font-size: 11px;">REPONSABLE</th>
        <th style="width:10%;font-size: 11px;">FECHA ENTREGA</th>

<tbody>
    {body}
