
<table id="datosTabla" style="table-layout: fixed; width: 100%; word-wrap: break-word; border-collapse: collapse; font-family:Verdana, Geneva, sans-serif; font-size:12px"
                 align='center' cellpadding="5" border="1" class="noBorder">
    <thead>
        <tr>
            <th style="border:0;" colspan="7" style="width:100%;font-size: 12px;">ESTADO DE CUENTAS POR PAGAR</th>
        </tr>
        <tr>
            <th style="border:0;" colspan="7" style="width:100%;font-size: 12px;">{empresa}</th>
        </tr>
        <tr>
            <th style="border:0;" colspan="7" style="width:100%;font-size: 12px;">{fecha}</th>
        </tr>

        <tr>
            <th align='left' style="border:0;" colspan="7" style="width:100%;font-size: 12px;">Rango 1: {Rango1} Rango 2: {Rango2} Rango 3: {Rango3} dias</th>
        </tr>

        <tr>
            <th style="width:40%;font-size: 12px;">PROVEEDOR</th>
            <th style="width:10%;font-size: 12px;" >POR VENCER</th>
            <th style="width:10%;font-size: 12px;">RANGO 1</th>
            <th style="width:10%;font-size: 12px;">RANGO 2</th>
            <th style="width:10%;font-size: 12px;">RANGO 3</th>
            <th style="width:10%;font-size: 12px;">> RANGO 3</th>
            <th style="width:10%;font-size: 12px;" align='right'>TOTAL</th>
        </tr>
    </thead>
    <tbody>
        {body}
    </tbody>
</table>
