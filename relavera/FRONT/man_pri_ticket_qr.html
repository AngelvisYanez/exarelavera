<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ticket Manifiesto - QR</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 10px;
            color: #000;
            padding: 10px;
        }

        .ticket {
            width: 80mm;
            max-width: 80mm;
            margin: 0 auto;
            padding: 8px;
            border: 2px dashed #000;
        }

        .header {
            text-align: center;
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 2px solid #000;
        }

        .header h1 {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 4px;
        }

        .header h2 {
            font-size: 10px;
            font-weight: normal;
        }

        .info-section {
            margin-bottom: 10px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
            font-size: 9px;
        }

        .info-label {
            font-weight: bold;
        }

        .info-value {
            text-align: right;
            word-break: break-word;
        }

        .qr-section {
            text-align: center;
            margin: 15px 0;
            padding: 10px 0;
            border-top: 2px solid #000;
            border-bottom: 2px solid #000;
        }

        .qr-code {
            margin: 0 auto;
            display: block;
            width: 200px;
            height: 200px;
            max-width: 100%;
            border: 1px solid #ddd;
        }

        .footer {
            text-align: center;
            margin-top: 10px;
            padding-top: 8px;
            border-top: 2px solid #000;
            font-size: 8px;
        }

        .separator {
            border-top: 1px dashed #000;
            margin: 8px 0;
        }

        @media print {
            body {
                margin: 0;
                padding: 0;
            }

            .ticket {
                border: none;
                padding: 5px;
            }

            @page {
                size: 80mm auto;
                margin: 0;
            }
        }
    </style>
</head>
<body>
    <div class="ticket">
        <!-- Encabezado -->
        <div class="header">
            <h1>MINISTERIO DEL AMBIENTE</h1>
            <h2>MANIFIESTO DE DESECHOS PELIGROSOS</h2>
        </div>

        <!-- Información del Manifiesto -->
        <div class="info-section">
            <div class="info-row">
                <span class="info-label">Cliente:</span>
            </div>
            <div class="info-value" style="text-align: left; margin-bottom: 8px; font-size: 10px; font-weight: bold;">
                {cliente}
            </div>
            
            <div class="separator"></div>
            
            <div class="info-row">
                <span class="info-label">Código:</span>
                <span class="info-value">{Man_Cod}</span>
            </div>
            <div class="info-row">
                <span class="info-label">N° Manifiesto:</span>
                <span class="info-value">{Man_Num}</span>
            </div>
            <div class="info-row">
                <span class="info-label">Fecha:</span>
                <span class="info-value">{Man_Fec}</span>
            </div>
        </div>

        <!-- Código QR -->
        <div class="qr-section">
            <img src="{QR_CODE_IMAGE}" alt="Código QR" class="qr-code" />
            <p style="margin-top: 8px; font-size: 8px; font-weight: bold;">Escanea el código QR</p>
        </div>

        <!-- Pie de página -->
        <div class="footer">
            <p>Ticket generado el {fecha_impresion}</p>
            <p style="margin-top: 4px;">Conserve este ticket</p>
        </div>
    </div>
</body>
</html>
